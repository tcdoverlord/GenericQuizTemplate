<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A reusable, responsive HTML quiz template with required answers, hints, explanations, scoring, and light/dark mode.">
  <title>Generic Quiz Template</title>

  <style>
    :root {
      color-scheme: light;
      --bg: #f5f5f5;
      --surface: #ffffff;
      --surface-alt: #f9f9f9;
      --text: #172033;
      --muted: #5d687a;
      --border: #cccccc;
      --border-soft: #e0e0e0;
      --primary: #007bff;
      --primary-hover: #0056b3;
      --success: #16803c;
      --success-bg: #eaf8ef;
      --danger: #c62828;
      --danger-bg: #fdecec;
      --warning: #9a6700;
      --warning-bg: #fff7df;
      --info: #1769e0;
      --focus: #7aaeff;
      --shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --bg: #10141b;
      --surface: #181e27;
      --surface-alt: #202733;
      --text: #eef2f7;
      --muted: #aab5c4;
      --border: #364151;
      --border-soft: #414c5c;
      --primary: #5d9cff;
      --primary-hover: #82b3ff;
      --success: #57d47d;
      --success-bg: #173522;
      --danger: #ff7373;
      --danger-bg: #3b1d21;
      --warning: #ffd166;
      --warning-bg: #3b3118;
      --info: #82b3ff;
      --focus: #8bb8ff;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      font-family: Arial, Helvetica, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    h1,
    h2 {
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
    }

    h2 {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 1.1rem;
      font-weight: 400;
    }

    .toolbar {
      max-width: 600px;
      margin: 0 auto;
      display: flex;
      justify-content: flex-end;
    }

    .theme-toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      width: auto;
      margin: 0;
      padding: 9px 14px;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 999px;
      box-shadow: none;
      font-size: 14px;
    }

    .theme-toggle:hover {
      background: var(--surface-alt);
    }

    #quiz-section {
      max-width: 600px;
      margin: 20px auto;
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: var(--shadow);
      padding: 20px;
    }

    .question {
      margin-bottom: 20px;
      background-color: var(--surface-alt);
      border: 1px solid var(--border-soft);
      border-radius: 5px;
      padding: 15px;
    }

    .question:last-child {
      margin-bottom: 0;
    }

    .question p.question-text {
      margin: 0 0 10px;
      font-weight: bold;
      line-height: 1.5;
    }

    .option {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      margin: 8px 0;
      padding: 7px;
      border-radius: 5px;
      cursor: pointer;
    }

    .option:hover {
      background: var(--surface);
    }

    .option input {
      margin-top: 3px;
      accent-color: var(--primary);
    }

    .option label {
      cursor: pointer;
      line-height: 1.4;
    }

    .question-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    button {
      display: block;
      margin: 20px auto;
      padding: 10px 20px;
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    button.secondary,
    button.hint-button {
      margin: 0;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      font-size: 14px;
      padding: 8px 12px;
    }

    button.secondary:hover,
    button.hint-button:hover {
      background: var(--surface-alt);
    }

    .hint {
      margin: 10px 0 0;
      padding: 10px;
      color: var(--info);
      background: var(--surface);
      border-left: 4px solid var(--info);
      border-radius: 4px;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .feedback {
      margin-top: 12px;
      padding: 11px 12px;
      border-radius: 5px;
      line-height: 1.5;
    }

    .feedback.correct {
      color: var(--success);
      background: var(--success-bg);
      border-left: 4px solid var(--success);
      font-weight: 600;
    }

    .feedback.incorrect {
      color: var(--danger);
      background: var(--danger-bg);
      border-left: 4px solid var(--danger);
      font-weight: 600;
    }

    .feedback.warning {
      color: var(--warning);
      background: var(--warning-bg);
      border-left: 4px solid var(--warning);
      font-weight: 600;
    }

    .feedback.info {
      color: var(--info);
      background: var(--surface);
      border-left: 4px solid var(--info);
    }

    .feedback-explanation {
      margin-top: 7px;
      font-size: 0.95rem;
      font-weight: 400;
      line-height: 1.5;
    }

    .correct-answer {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border-soft);
    }

    #actions {
      max-width: 600px;
      margin: 20px auto;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    #actions button {
      margin: 0;
    }

    #score-section {
      max-width: 600px;
      margin: 20px auto;
      padding: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: var(--shadow);
      text-align: center;
      font-size: 1.1em;
    }

    .score-row {
      margin: 8px 0;
    }

    .hidden {
      display: none;
    }

    .empty-message {
      margin: 0;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 520px) {
      body {
        padding: 12px;
      }

      .toolbar {
        justify-content: center;
      }

      #quiz-section,
      #score-section {
        padding: 14px;
      }

      #actions {
        flex-direction: column;
      }

      #actions button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <h1>Quiz Template</h1>
  <h2>Test Your Knowledge!</h2>

  <div class="toolbar">
    <button id="theme-toggle" class="theme-toggle" type="button"
      aria-label="Switch to dark mode" aria-pressed="false">
      <span id="theme-icon" aria-hidden="true">🌙</span>
      <span id="theme-label">Dark Mode</span>
    </button>
  </div>

  <div id="quiz-section" aria-label="Quiz"></div>

  <div id="actions">
    <button id="submit-button" type="button">Submit Answers</button>
    <button id="reset-button" class="secondary" type="button">Reset Quiz</button>
  </div>

  <div id="score-section" class="hidden" aria-live="polite"></div>

  <script>
    /*
      ============================================================
      QUIZ DATA
      ============================================================

      Replace the example questions below with your own.

      One answer:
        answer: ["Correct Answer"]

      Multiple answers:
        answer: ["Answer A", "Answer B"]

      Add a hint when you want learners to get help:
        hint: "Your hint goes here."

      Each question can also include an explanation:
        explanation: "Explain why the answer is correct."

      For multiple-answer questions, the number of items in
      "answer" determines how many choices the learner must select.
    */

    const questions = [
      {
        question: "Example 1: What is 2 + 2?",
        options: ["3", "4", "5", "6"],
        answer: ["4"],
        explanation: "2 + 2 equals 4.",
        hint: "Think about adding two groups of two."
      },
      {
        question: "Example 2: Select all prime numbers. (Select TWO.)",
        options: ["4", "5", "6", "7"],
        answer: ["5", "7"],
        explanation:
          "Prime numbers are integers greater than 1 that are divisible only by 1 and themselves. In this case, 5 and 7 are prime.",
        hint:
          "A prime number greater than 1 has exactly two positive divisors: 1 and itself."
      }
    ];

    const quizSection = document.getElementById("quiz-section");
    const scoreSection = document.getElementById("score-section");
    const submitButton = document.getElementById("submit-button");
    const resetButton = document.getElementById("reset-button");
    const themeToggle = document.getElementById("theme-toggle");
    const themeIcon = document.getElementById("theme-icon");
    const themeLabel = document.getElementById("theme-label");

    function applyTheme(theme) {
      document.documentElement.dataset.theme = theme;

      const darkMode = theme === "dark";
      themeIcon.textContent = darkMode ? "☀️" : "🌙";
      themeLabel.textContent = darkMode ? "Light Mode" : "Dark Mode";

      themeToggle.setAttribute("aria-pressed", String(darkMode));
      themeToggle.setAttribute(
        "aria-label",
        darkMode ? "Switch to light mode" : "Switch to dark mode"
      );

      localStorage.setItem("quiz-theme", theme);
    }

    function initializeTheme() {
      const savedTheme = localStorage.getItem("quiz-theme");

      if (savedTheme === "dark" || savedTheme === "light") {
        applyTheme(savedTheme);
        return;
      }

      const prefersDark =
        window.matchMedia &&
        window.matchMedia("(prefers-color-scheme: dark)").matches;

      applyTheme(prefersDark ? "dark" : "light");
    }

    themeToggle.addEventListener("click", () => {
      const currentTheme = document.documentElement.dataset.theme;
      applyTheme(currentTheme === "dark" ? "light" : "dark");
    });

    function createQuiz() {
      quizSection.innerHTML = "";

      if (!questions.length) {
        quizSection.innerHTML =
          '<p class="empty-message">No questions have been added yet.</p>';
        return;
      }

      questions.forEach((q, index) => {
        const questionDiv = document.createElement("div");
        questionDiv.className = "question";
        questionDiv.id = `question-${index}`;

        const questionText = document.createElement("p");
        questionText.className = "question-text";
        questionText.textContent = q.question;
        questionDiv.appendChild(questionText);

        const isMultiAnswer = q.answer.length > 1;

        q.options.forEach((option, optionIndex) => {
          const optionDiv = document.createElement("div");
          optionDiv.className = "option";

          const optionInput = document.createElement("input");
          optionInput.type = isMultiAnswer ? "checkbox" : "radio";
          optionInput.name = `question${index}`;
          optionInput.id = `question${index}-option${optionIndex}`;
          optionInput.value = option;

          const optionLabel = document.createElement("label");
          optionLabel.htmlFor = optionInput.id;
          optionLabel.textContent = option;

          optionDiv.appendChild(optionInput);
          optionDiv.appendChild(optionLabel);
          questionDiv.appendChild(optionDiv);
        });

        if (q.hint) {
          const actions = document.createElement("div");
          actions.className = "question-actions";

          const hintButton = document.createElement("button");
          hintButton.type = "button";
          hintButton.className = "hint-button";
          hintButton.textContent = "💡 Show Hint";

          const hintText = document.createElement("div");
          hintText.className = "hint hidden";
          hintText.textContent = q.hint;

          hintButton.addEventListener("click", () => {
            const isHidden = hintText.classList.toggle("hidden");
            hintButton.textContent = isHidden
              ? "💡 Show Hint"
              : "🙈 Hide Hint";
          });

          actions.appendChild(hintButton);
          questionDiv.appendChild(actions);
          questionDiv.appendChild(hintText);
        }

        quizSection.appendChild(questionDiv);
      });
    }

    function getSelectedOptions(index) {
      return Array.from(
        document.querySelectorAll(`input[name="question${index}"]:checked`)
      ).map(input => input.value);
    }

    function clearFeedback() {
      document.querySelectorAll(".feedback").forEach(feedback => {
        feedback.remove();
      });
    }

    function addFeedback(questionDiv, type, message, explanation = "") {
      const feedback = document.createElement("div");
      feedback.className = `feedback ${type}`;

      const messageText = document.createElement("div");
      messageText.innerHTML = message;
      feedback.appendChild(messageText);

      if (explanation) {
        const explanationText = document.createElement("div");
        explanationText.className = "feedback-explanation";
        explanationText.textContent = explanation;
        feedback.appendChild(explanationText);
      }

      questionDiv.appendChild(feedback);
    }

    function checkAnswers() {
      clearFeedback();

      let correctCount = 0;

      questions.forEach((q, index) => {
        const questionDiv = document.getElementById(`question-${index}`);
        const selectedOptions = getSelectedOptions(index);
        const requiredCount = q.answer.length;
        const isMultiAnswer = requiredCount > 1;

        if (selectedOptions.length === 0) {
          addFeedback(
            questionDiv,
            "warning",
            "Please select your answer before continuing."
          );
          return;
        }

        if (isMultiAnswer && selectedOptions.length < requiredCount) {
          const remaining = requiredCount - selectedOptions.length;

          addFeedback(
            questionDiv,
            "warning",
            `This question requires <strong>${requiredCount} choices</strong>. Please select <strong>${remaining} more ${remaining === 1 ? "choice" : "choices"}</strong> to continue.`
          );
          return;
        }

        if (selectedOptions.length > requiredCount) {
          addFeedback(
            questionDiv,
            "warning",
            `Please select exactly <strong>${requiredCount} choices</strong> for this question.`
          );
          return;
        }

        const isCorrect =
          q.answer.length === selectedOptions.length &&
          q.answer.every(answer => selectedOptions.includes(answer));

        if (isCorrect) {
          correctCount++;

          addFeedback(
            questionDiv,
            "correct",
            "Correct!",
            q.explanation || ""
          );
        } else {
          const wrongSelections = selectedOptions.filter(
            option => !q.answer.includes(option)
          );

          let explanation = q.explanation || "";

          if (wrongSelections.length) {
            explanation =
              `You selected: ${wrongSelections.join(", ")}. ` +
              (q.explanation || "");
          }

          addFeedback(
            questionDiv,
            "incorrect",
            "Incorrect!",
            explanation
          );

          const correctAnswer = document.createElement("div");
          correctAnswer.className = "correct-answer";
          correctAnswer.innerHTML =
            `<strong>Correct answer${requiredCount > 1 ? "s" : ""}:</strong> ` +
            q.answer.join(", ");
          questionDiv.querySelector(".feedback").appendChild(correctAnswer);
        }
      });

      displayResults(correctCount);
    }

    function displayResults(correctCount) {
      const totalQuestions = questions.length;

      if (!totalQuestions) {
        scoreSection.classList.remove("hidden");
        scoreSection.innerHTML =
          "<h3>Quiz Results</h3><p>No questions to grade.</p>";
        return;
      }

      const missedCount = totalQuestions - correctCount;
      const percentage = (correctCount / totalQuestions) * 100;

      let grade;

      if (percentage >= 90) {
        grade = "A";
      } else if (percentage >= 80) {
        grade = "B";
      } else if (percentage >= 70) {
        grade = "C";
      } else if (percentage >= 60) {
        grade = "D";
      } else {
        grade = "F";
      }

      scoreSection.innerHTML = `
        <h3>Quiz Results</h3>
        <p class="score-row">Correct Answers: <strong>${correctCount}</strong></p>
        <p class="score-row">Missed Answers: <strong>${missedCount}</strong></p>
        <p class="score-row">Percentage: <strong>${percentage.toFixed(2)}%</strong></p>
        <p class="score-row">Grade: <strong>${grade}</strong></p>
      `;

      scoreSection.classList.remove("hidden");
      scoreSection.scrollIntoView({ behavior: "smooth", block: "start" });

      alert(
        `You got ${correctCount} out of ${totalQuestions} questions correct!`
      );
    }

    function resetQuiz() {
      createQuiz();
      scoreSection.classList.add("hidden");
      scoreSection.innerHTML = "";
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    submitButton.addEventListener("click", checkAnswers);
    resetButton.addEventListener("click", resetQuiz);

    initializeTheme();
    createQuiz();
  </script>
</body>
</html>
